name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore RedisDiagnostic.sln
      - name: Build
        run: dotnet build RedisDiagnostic.sln -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/RedisDiagnostic.Tests/RedisDiagnostic.Tests.csproj -c Release --no-build

  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore RedisDiagnostic.sln
      - name: Build
        run: dotnet build RedisDiagnostic.sln -c Release --no-restore
      - name: Functional tests
        run: dotnet test tests/RedisDiagnostic.FunctionalTests/RedisDiagnostic.FunctionalTests.csproj -c Release --no-build
